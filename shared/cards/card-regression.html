<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Systema Card Canonical Template Fixture</title>
  <link rel="stylesheet" href="card-renderer.css?v=canonical-template-v1">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#070807;color:#eee;font-family:Inter,system-ui,sans-serif}
    h1{margin:0 0 6px}.note{margin:0 0 22px;color:#aaa}.fixture{display:grid;gap:26px}.fixture-row{padding:18px;border:1px solid #343834;background:#101210}
    .fixture-row h2{margin:0 0 14px;font-size:1rem}.surfaces{display:flex;align-items:flex-start;gap:24px;overflow-x:auto}
    .surface{display:grid;justify-items:center;gap:8px;min-width:max-content}.surface:has(.systema-card--expanded){width:360px}.surface>span{font-size:.72rem;color:#aaa;text-transform:uppercase;letter-spacing:.1em}
    #status{position:sticky;top:8px;z-index:10;width:max-content;margin-left:auto;padding:8px 12px;background:#18261b;border:1px solid #4b7652}
  </style>
</head>
<body>
  <div id="status">Checking canonical geometry…</div>
  <h1>Canonical premium-v1 regression fixture</h1>
  <p class="note">Every surface below is generated by SystemaCardRenderer. Only the complete-card width changes.</p>
  <main id="fixture" class="fixture"></main>
  <script src="card-keywords.js?v=canonical-template-v1"></script>
  <script src="card-schema.js?v=canonical-template-v1"></script>
  <script src="card-assets.js?v=canonical-template-v1"></script>
  <script src="card-layout.js?v=canonical-template-v1"></script>
  <script src="card-renderer.js?v=canonical-template-v1"></script>
  <script>
    (async function () {
      const catalog = await SystemaCardSchema.loadCatalog('cards.json');
      const byId = Object.fromEntries(catalog.cards.map(card => [card.id, card]));
      const fixtures = [
        ['done-here', 'Approved reference · long title · keyword heavy'],
        ['spear', 'Spear Thrust'],
        ['pack', 'Pack Rush'],
        ['bandage', 'Bandage'],
        ['sync', 'Synchronized Kill']
      ];
      const surfaces = [
        ['Card Studio', 'collection'],
        ['Combat', 'combat'],
        ['Archive', 'collection'],
        ['Forge / Vault', 'collection'],
        ['Rewards', 'collection'],
        ['Expanded preview', 'expanded']
      ];
      window.SystemaCardCatalog = byId;
      document.getElementById('fixture').innerHTML = fixtures.map(([id, label]) => `
        <section class="fixture-row" data-fixture="${id}">
          <h2>${label}</h2>
          <div class="surfaces">${surfaces.map(([surface, mode]) => `<div class="surface"><span>${surface}</span>${SystemaCardRenderer.html(byId[id], { mode })}</div>`).join('')}</div>
        </section>`).join('');
      requestAnimationFrame(() => {
        const selectors = ['.systema-card__header','.systema-card__art','.systema-card__rules','footer'];
        const cards = [...document.querySelectorAll('[data-systema-card]')];
        const signature = card => {
          const box = card.getBoundingClientRect();
          return selectors.map(selector => {
            const rect = card.querySelector(selector).getBoundingClientRect();
            return rect.height / box.height;
          });
        };
        const expected = signature(cards[0]);
        const pass = cards.every(card => card.dataset.cardTemplate === 'premium-v1' && Math.abs(card.getBoundingClientRect().width / card.getBoundingClientRect().height - 2 / 3) < .002 && signature(card).every((value, index) => Math.abs(value - expected[index]) < .002));
        const status = document.getElementById('status');
        status.textContent = pass ? `PASS · ${cards.length} cards share ${expected.map(value => value.toFixed(3)).join(':')}` : 'FAIL · canonical geometry mismatch';
        status.style.background = pass ? '#18261b' : '#421b1b';
        status.dataset.pass = String(pass);
      });
    })();
  </script>
</body>
</html>
